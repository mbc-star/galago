  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.floor(cw*dpr);cv.height=Math.floor(ch*dpr);
  overlay=mk(cv.width,cv.height);const o=overlay.getContext('2d'),ps=cv.height/H;
  if(ps>=2){o.fillStyle='rgba(0,0,0,0.20)';const th=Math.max(1,Math.round(ps*0.34));
    for(let y=0;y<H;y++)o.fillRect(0,Math.floor((y+1)*ps)-th,cv.width,th);}
  const vg=o.createRadialGradient(cv.width/2,cv.height/2,cv.height*0.45,cv.width/2,cv.height/2,cv.width*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  o.fillStyle=vg;o.fillRect(0,0,cv.width,cv.height);
}

  const sw=cv.width,sh=cv.height;

  b1x.globalCompositeOperation='source-over';b1x.drawImage(gc,0,0,b1.width,b1.height);

// sprite dessiné à la main ; mirror : 1 = symétrie haut/bas complète, 2 = ligne centrale unique
function spr(rows,pal,mirror){
  if(mirror===1)rows=rows.concat(rows.slice().reverse());
  if(mirror===2)rows=rows.concat(rows.slice(0,-1).reverse());
  const w=Math.max.apply(null,rows.map(r=>r.length)),c=mk(w,rows.length),k=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const p=pal[r[x]];if(p){k.fillStyle=p;k.fillRect(x,y,1,1);}}});
  return finish(c);
}
// sprite procédural : masque de matières + ombrage automatique (contour, clair, moyen, sombre)
function proc(w,h,fn,ramps){
  const m=[];for(let y=0;y<h;y++){m.push([]);for(let x=0;x<w;x++)m[y].push(fn(x,y)|0);}
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:m[y][x];
  const c=mk(w,h),k=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=m[y][x];if(!v)continue;const r=ramps[v];let col;
    if(r.length===1)col=r[0];
    else if(!at(x-1,y)||!at(x+1,y)||!at(x,y-1)||!at(x,y+1))col=r[0];
    else if(!at(x,y-2)||!at(x,y-3)||!at(x-2,y-1))col=r[1];
    else if(!at(x,y+2)||!at(x,y+3)||!at(x+2,y+1))col=r[3];
    else col=(((x+y)&1)&&!at(x,y+6))?r[3]:r[2];
    k.fillStyle=col;k.fillRect(x,y,1,1);}
  return finish(c);
}

let ac=null,master,mus,sfxG,delayIn,bassF,noiseB,muted=false;
function audioInit(){
  if(ac){if(ac.state==='suspended'&&!paused)ac.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{ac=new AC();}catch(e){ac=null;return;}
  master=ac.createGain();master.gain.value=muted?0:0.85;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=0.55;mus.connect(master);
  sfxG=ac.createGain();sfxG.gain.value=0.75;sfxG.connect(master);
  const d=ac.createDelay(1);d.delayTime.value=0.26;const fb=ac.createGain();fb.gain.value=0.33;
  const dl=ac.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2600;
  delayIn=ac.createGain();delayIn.gain.value=0.4;delayIn.connect(d);d.connect(dl);dl.connect(fb);fb.connect(d);dl.connect(mus);
  bassF=ac.createBiquadFilter();bassF.type='lowpass';bassF.frequency.value=700;bassF.Q.value=4;bassF.connect(mus);
  noiseB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const ch=noiseB.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=rnd()*2-1;
  if(ac.state==='suspended')ac.resume();
}
function env(gn,t,vol,dur,a,hold){a=a||0.004;gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+a);
  gn.gain.setValueAtTime(vol,t+Math.max(a,dur*(hold||0.4)));gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(o){
  if(!ac)return;const t=o.t||ac.currentTime,os=ac.createOscillator(),gn=ac.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(o.f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);
  if(o.det)os.detune.value=o.det;
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=6;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+o.dur+0.05);}
  env(gn,t,o.vol,o.dur,o.a,o.hold);os.connect(gn);gn.connect(o.dest||sfxG);if(o.send)gn.connect(delayIn);
  os.start(t);os.stop(t+o.dur+0.05);
}
function noise(o){
  if(!ac)return;const t=o.t||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();
  s.buffer=noiseB;s.loop=true;f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.f,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);f.Q.value=o.q||0.8;
  env(gn,t,o.vol,o.dur,o.a,o.hold||0.1);s.connect(f);f.connect(gn);gn.connect(o.dest||sfxG);
  s.start(t,rnd()*0.9);s.stop(t+o.dur+0.05);
}

  for(const b of pb){
    b.x+=b.vx;b.y+=b.vy;if(b.x>W+24||b.y<-10||b.y>H+10){b.gone=1;continue;}
    if(level>0){const wx=scrollX+b.x;if(b.y<terr(wx,1)||b.y>H-terr(wx,0)){b.gone=1;spark(b.x,b.y,CY,2);continue;}}
    for(const e of enemies){if(e.dead||e.gone)continue;
      if(Math.abs(b.x-e.x)<b.hw+e.hw&&Math.abs(b.y-e.y)<b.hh+e.hh){
        if(b.pierce){if(b.hit.has(e))continue;b.hit.add(e);}else b.gone=1;
        spark(b.x+b.hw,b.y,YL,2);hurt(e,b.dmg);if(!b.pierce)break;}}
    if(boss&&!boss.dying&&!b.gone)for(const p of boss.pl){
      if(Math.abs(b.x-p.x)<b.hw+p.hw&&Math.abs(b.y-p.y)<b.hh+p.hh){
        if(p.vuln){if(b.pierce){if(b.hit.has(p.id))continue;b.hit.add(p.id);}else b.gone=1;
          spark(p.x-p.hw,b.y,YL,3);
          if(p.can){p.can.hp-=b.dmg;p.can.flash=3;sfx.hit();if(p.can.hp<=0){explode(p.x,p.y,2.5,OR);score+=2000;}}
          else bossHit(boss,b.dmg);}
        else{b.gone=1;spark(b.x+b.hw,b.y,WH,2);sfx.ting();}
        if(b.gone)break;}}
  }
  // tirs ennemis
  for(const b of eb){
    b.x+=b.vx;b.y+=b.vy;b.t++;
    if(b.x<-8||b.x>W+8||b.y<-8||b.y>H+8){b.gone=1;continue;}
    if(level>0){const wx=scrollX+b.x;if(b.y<terr(wx,1)-2||b.y>H-terr(wx,0)+2){b.gone=1;continue;}}
    if(P.alive&&Math.abs(b.x-P.x)<6&&Math.abs(b.y-P.y)<3.5){b.gone=1;hitPlayer();}
  }
  // collisions joueur / ennemis / bonus
  if(P.alive)for(const e of enemies){if(e.dead)continue;
    if(Math.abs(e.x-P.x)<e.hw+8&&Math.abs(e.y-P.y)<e.hh+3){if(P.inv<=0&&!GOD){hurt(e,4);hitPlayer();}break;}}
  for(const p of pups){p.t++;p.x-=0.7;p.y+=Math.sin(p.t*0.07)*0.4;
    if(level>0){const wx=scrollX+p.x;p.y=clamp(p.y,terr(wx,1)+8,H-terr(wx,0)-8);}
    if(p.x<-12)p.gone=1;
    else if(P.alive&&Math.abs(p.x-P.x)<17&&Math.abs(p.y-P.y)<12){p.gone=1;collect(p);}}
  enemies=enemies.filter(e=>!e.dead&&!e.gone);pb=pb.filter(b=>!b.gone);eb=eb.filter(b=>!b.gone);pups=pups.filter(p=>!p.gone);
  if(banner&&--banner.t<=0)banner=null;
  if(clearT>0&&--clearT===0){
    if(score>hi){hi=score;try{localStorage.setItem('astraVortexHi',hi);}catch(e){}}
    if(level<2)startLevel(level+1);else{state='win';overT=0;playSong('title');}
  }
}
function updParts(){
  for(const p of parts){p.life--;
    if(p.k===0){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;}
    else if(p.k===1){p.x+=p.vx-0.5;p.y+=p.vy;}
    else if(p.k===3)p.r+=p.vr;}
  parts=parts.filter(p=>p.life>0);
  if(parts.length>700)parts.splice(0,parts.length-700);
}
function update(){
  frame++;
  const I=readInput();
  if(pressed.KeyM){muted=!muted;if(master)master.gain.value=muted?0:0.85;}
  if(state==='play'&&(pressed.KeyP||pressed.Escape)){paused=!paused;if(ac){if(paused){sfx.charge(false);ac.suspend();}else ac.resume();}}
  if(paused){pressed={};return;}
  if(shake>0)shake=Math.max(0,shake-0.6);if(flashA>0)flashA=Math.max(0,flashA-0.04);
  if(state==='title'){scrollX+=0.6;if(I.start||pressed.Space){audioInit();newGame(HASH.indexOf('l3')>=0?2:HASH.indexOf('l2')>=0?1:0);}else playSong('title');}
  else if(state==='play'){updPlay(I);}
  else if(state==='over'){overT++;scrollX+=0.3;if(overT>50&&(I.start||pressed.Space)){score=0;lives=2;P.wl=1;P.sp=0;P.shield=0;P.opts=0;sfx.start();startLevel(level);}}
  else if(state==='win'){overT++;scrollX+=0.8;if(overT%14===0)explode(40+rnd()*400,30+rnd()*150,1.5,[CY,MG,YL,GR][rnd()*4|0],true);
    if(overT>120&&(I.start||pressed.Space)){state='title';playSong(null);}}
  updParts();
  pressed={};
}

// ---------------------------------------------------------------- rendu
function drawStars(k){
  for(const s of stars){let x=(s.x-scrollX*s.z*k)%W;if(x<0)x+=W;
    if(s.z>0.5&&Math.sin(frame*0.05+s.p)>0.9)continue;
    g.fillStyle=s.c;g.fillRect(x|0,s.y|0,1,1);}
}
function drawBG(){
  const lv=state==='title'||state==='win'?0:level;
  if(lv===0){
    g.fillStyle='#04030c';g.fillRect(0,0,W,H);
    const nx=-((scrollX*0.15)%960);g.drawImage(nebula,nx,0);g.drawImage(nebula,nx+960,0);
    ds(S.planet,400-scrollX*0.04,74);light(400-scrollX*0.04,74,60,PU,0.25);
    drawStars(1);
  }else if(lv===1){
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#020a0e');gr.addColorStop(0.5,'#06222a');gr.addColorStop(1,'#020a0e');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    for(let L=0;L<2;L++){const par=L?0.65:0.35,o=Math.floor(scrollX*par);g.fillStyle=L?'#0a3038':'#07232a';
      for(let x=-(o%4);x<W;x+=4){const wx=o+x+(L?900:0);
        const t=(L?26:44)+Math.sin(wx*0.009+L)*18+Math.sin(wx*0.023)*12+Math.sin(wx*0.061)*5;
        const b2=(L?26:44)+Math.sin(wx*0.011+2+L)*18+Math.sin(wx*0.027+1)*12+Math.sin(wx*0.057)*5;
        g.fillRect(x,0,4,Math.round(t/2)*2);g.fillRect(x,H-Math.round(b2/2)*2,4,Math.round(b2/2)*2);}}
    for(let i=0;i<14;i++){const s=stars[i*3+2];let x=(s.x*2-scrollX*0.8)%(W+40);if(x<-20)x+=W+40;
      const y=60+((s.y*1.3+Math.sin(frame*0.02+s.p)*8)%150);g.fillStyle='#8cffc0';g.fillRect(x|0,y|0,1,1);light(x,y,7+3*Math.sin(frame*0.05+s.p),GR,0.35);}
  }else{
    g.fillStyle='#05060e';g.fillRect(0,0,W,H);
    let o=Math.floor(scrollX*0.3);
    for(let x=-(o%64);x<W;x+=64){const id=Math.floor((o+x)/64);g.fillStyle='#0b0f20';g.fillRect(x+8,0,40,H);g.fillStyle='#10162c';g.fillRect(x+8,0,2,H);
      for(let j=0;j<9;j++){const h=hsh(id*31+j);if(h<0.55)continue;const lit=h>0.9&&((frame>>5)+id+j)%3!==0;
        g.fillStyle=lit?'#ffd640':'#1a3a6a';g.fillRect(x+16+(j%2)*14,22+j*27,8,4);if(lit)light(x+20+(j%2)*14,24+j*27,10,YL,0.3);}}
    o=Math.floor(scrollX*0.6);g.fillStyle='#0e1630';g.fillRect(0,84,W,7);g.fillRect(0,182,W,7);g.fillStyle='#18244a';g.fillRect(0,84,W,1);g.fillRect(0,182,W,1);
    for(let x=-(o%32);x<W;x+=32){g.fillStyle='#070a16';g.fillRect(x,84,3,7);g.fillRect(x,182,3,7);}
  }
}
function drawTerrain(){
  if(level===0||state==='title'||state==='win')return;
  const c=level===1?['#0c2c22','#1c5a40','#6dffb0']:['#1a2136','#2c3858','#93a8dc'];
  const off=scrollX%4;
  for(let x=-off;x<W;x+=4){const wx=scrollX+x,t=terr(wx,1),b=terr(wx,0);
    g.fillStyle=c[0];g.fillRect(x,0,4,t);g.fillRect(x,H-b,4,b);
    g.fillStyle=c[1];g.fillRect(x,t-5,4,3);g.fillRect(x,H-b+2,4,3);
    g.fillStyle=c[2];g.fillRect(x,t-2,4,2);g.fillRect(x,H-b,4,2);
    if(level===1){const h=hsh(wx*0.13);if(h>0.78){g.fillStyle='#061a14';g.fillRect(x+1,Math.max(0,t-9-((h*40)|0)%(t>12?t-10:1)),2,2);g.fillRect(x+1,H-b+8+((h*50)|0)%(b>12?b-10:1),2,2);}
      if(h<0.03){light(x,t,12,GR,0.5);light(x,H-b,12,GR,0.5);}}
    else if(wx%40===0){const on=((frame>>4)+wx/40)%2<1;g.fillStyle=on?'#ffa030':'#5a3410';g.fillRect(x,t-2,2,2);g.fillRect(x,H-b,2,2);
      if(on){light(x+1,t-1,9,OR,0.6);light(x+1,H-b+1,9,OR,0.6);}}
  }
}
function drawParts(){
  for(const p of parts){const q=p.life/p.max;
    if(p.k===0){g.fillStyle='rgba('+p.rgb+','+Math.min(1,q*1.6)+')';g.fillRect(p.x|0,p.y|0,q>0.5?2:1,q>0.5?2:1);if(q>0.4)light(p.x,p.y,5,p.rgb,q*0.5);}
    else if(p.k===1){const col=q>0.75?'#ffffff':q>0.5?'#ffe05a':q>0.3?'#ff8a1e':q>0.15?'#c02a20':'#40181c';pixC(p.x,p.y,Math.max(1,p.r*(0.4+q*0.6)),col);}
    else if(p.k===2)light(p.x,p.y,p.r*(1.4-q*0.4),p.rgb,q);
    else if(p.k===3){g.globalCompositeOperation='lighter';g.globalAlpha=q*0.7;g.strokeStyle='rgb('+p.rgb+')';g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();g.globalAlpha=1;g.globalCompositeOperation='source-over';}
  }
}
const pad=(n,l)=>{n=String(Math.floor(n));while(n.length<l)n='0'+n;return n;};
function drawHUD(){
  textS('SCORE '+pad(score,7),6,5,'#ffffff');textS('HI '+pad(Math.max(hi,score),7),W/2,5,'#ffd640',1,1);
  g.drawImage(S.ship.c,W-52,3,12,6);textS('X'+lives,W-36,5,'#48ecff');
  textS('ARME '+P.wl,6,H-10,'#ff6078');textS('VIT '+(P.sp+1),46,H-10,'#48ecff');
  textS('RAYON',86,H-10,'#ffffff');g.fillStyle='#000';g.fillRect(109,H-11,52,7);g.fillStyle='#1a2a4a';g.fillRect(110,H-10,50,5);
  const p=P.charge/72;g.fillStyle=p>=1?((frame>>2)&1?'#ffffff':'#48ecff'):'#2a9cff';g.fillRect(110,H-10,Math.round(50*p),5);
  if(p>0.1)light(110+50*p,H-8,8,CY,0.6);
  if(boss&&boss.x<W+30){const bw=160,x=W/2-bw/2,q=boss.hp/boss.max;textS(boss.name,W/2,15,'#ff6078',1,1);
    g.fillStyle='#000';g.fillRect(x-1,22,bw+2,6);g.fillStyle='#3a0a14';g.fillRect(x,23,bw,4);
    g.fillStyle=q<0.3&&(frame>>2)&1?'#ffffff':'#ff3050';g.fillRect(x,23,Math.round(bw*q),4);light(x+bw*q,25,8,RD,0.6);}
  if(banner){const a=banner.t/70;textS(banner.s,banner.x,banner.y-14-(1-a)*14,'#ffe05a',1,1);}
  if(introT>0&&introT<170){text('NIVEAU '+(level+1),W/2+2,92,'#000',4,1);text('NIVEAU '+(level+1),W/2,90,(frame>>2)&1?'#48ecff':'#ffffff',4,1);
    textS(NAMES[level],W/2,120,'#ffd640',2,1);light(W/2,100,120,CY,0.18);}
  if(warnT>0){const a=0.5+0.5*Math.sin(warnT*0.25);g.fillStyle='rgba(255,20,50,'+(a*0.13)+')';g.fillRect(0,0,W,H);
    if(a>0.35){text('ALERTE',W/2+2,102,'#000',5,1);text('ALERTE',W/2,100,'#ff3050',5,1);textS('BOSS EN APPROCHE',W/2,134,'#ffffff',2,1);light(W/2,112,140,RD,0.3*a);}}
  if(clearT>0&&clearT<260){text('NIVEAU TERMINE',W/2+2,96,'#000',3,1);text('NIVEAU TERMINE',W/2,94,'#5aff82',3,1);
    textS('BONUS VIES '+lives+' X 1000',W/2,122,'#ffd640',1,1);light(W/2,100,130,GR,0.2);}
  if(GOD)text('GOD',W-18,H-10,'#5aff82');
}
function drawTitle(){
  const t=frame;
  for(let i=0;i<2;i++){const str=i?'VORTEX':'ASTRA',y=56+i*44,s=7,w=str.length*4*s-s,x0=W/2-w/2;
    text(str,W/2+3,y+3,'#1a0838',s,1);
    for(let n=0;n<str.length;n++){const hue=(t*1.5+n*26+i*90)%360;const gl=FONT[str[n]];
      for(let k=0;k<15;k++)if(gl[k]==='1'){const row=(k/3)|0;g.fillStyle='hsl('+((i?310:185)+row*9+Math.sin(hue*0.0174)*14)+',100%,'+(78-row*8)+'%)';
        g.fillRect(Math.round(x0+n*4*s+(k%3)*s),y+row*s,s,s);}}
    light(W/2,y+17,150,i?MG:CY,0.22+0.06*Math.sin(t*0.05+i));}
  const sx2=((t*1.6)%(W+160))-80,sy=162+Math.sin(t*0.04)*8;
  ds(S.ship,sx2,sy);light(sx2-14,sy,14,CY,0.8);g.fillStyle='#48ecff';g.fillRect(Math.round(sx2-17),Math.round(sy-1),5,2);
  if((t>>5)&1)textS('CLIC OU ENTREE POUR JOUER',W/2,184,'#ffffff',2,1);
  textS('FLECHES : DEPLACER    ESPACE : TIRER',W/2,212,'#9aa6d8',1,1);
  textS('X MAINTENU PUIS RELACHE : RAYON CHARGE',W/2,222,'#9aa6d8',1,1);
  textS('P : PAUSE    M : MUET',W/2,232,'#9aa6d8',1,1);
  textS('MEILLEUR SCORE '+pad(hi,7),W/2,250,'#ffd640',1,1);
}
function draw(){
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  drawBG();drawTerrain();
  if(state==='title'){drawParts();drawTitle();}
  else{
    if(state==='play'||state==='over'){
      for(const p of pups){const c=PUP[p.k],x=Math.round(p.x),y=Math.round(p.y);
        g.fillStyle='#000';g.fillRect(x-7,y-6,14,12);g.fillStyle=c[0];g.fillRect(x-6,y-5,12,10);g.fillStyle='#0a0a18';g.fillRect(x-5,y-4,10,8);
        text(p.k,x-1,y-2,(frame>>3)&1?'#ffffff':c[0]);light(x,y,16+3*Math.sin(p.t*0.15),c[1],0.6);}
      for(const e of enemies)drawEnemy(e);
      if(boss)boss.draw();
      for(const b of pb){
        if(b.k===0){g.fillStyle='#48ecff';g.fillRect(Math.round(b.x-5),Math.round(b.y-1),10,2);g.fillStyle='#ffffff';g.fillRect(Math.round(b.x),Math.round(b.y-1),5,b.dmg>1?2:1);light(b.x+2,b.y,8,CY,0.55);}
        else{const hw=Math.round(b.hw),hh=Math.round(b.hh),x=Math.round(b.x),y=Math.round(b.y);
          g.fillStyle='#2a7cff';g.fillRect(x-hw-6,y-hh+1,hw*2+4,hh*2-1);g.fillStyle='#48ecff';g.fillRect(x-hw,y-hh,hw*2,hh*2+1);
          g.fillStyle='#ffffff';g.fillRect(x-hw+3,y-(hh>>1),hw*2-1,(hh>>1)*2+1);pixC(x+hw,y,hh,'#ffffff');
          light(x+hw,y,18+b.p*22,CY,0.9);light(x-hw,y,14+b.p*14,BL,0.6);
          if(frame&1)parts.push({k:0,x:x-hw,y:y+(rnd()-0.5)*hh*2,vx:-1,vy:(rnd()-0.5),life:10,max:10,rgb:CY});}
      }
      drawPlayer();
      for(const b of eb){const x=Math.round(b.x),y=Math.round(b.y);
        const col=b.kind===1?['#5aff82',GR]:b.kind===2?['#48ecff',CY]:[(b.t>>2)&1?'#ff8a1e':'#ff4060',OR];
        g.fillStyle=col[0];g.fillRect(x-2,y-1,5,3);g.fillRect(x-1,y-2,3,5);g.fillStyle='#ffffff';g.fillRect(x-1,y-1,3,3);
        light(x,y,9,col[1],0.75);}
    }
    drawParts();
    if(state==='play'||state==='over')drawHUD();
    if(state==='over'){g.fillStyle='rgba(0,0,10,'+Math.min(0.6,overT*0.02)+')';g.fillRect(0,0,W,H);
      text('GAME OVER',W/2+2,92,'#000',5,1);text('GAME OVER',W/2,90,'#ff3050',5,1);light(W/2,102,140,RD,0.25);
      textS('SCORE '+pad(score,7),W/2,132,'#ffffff',2,1);
      if(overT>50&&(frame>>5)&1)textS('ENTREE : CONTINUER AU NIVEAU '+(level+1),W/2,160,'#ffd640',1,1);}
    if(state==='win'){text('MISSION ACCOMPLIE',W/2+2,72,'#000',4,1);text('MISSION ACCOMPLIE',W/2,70,(frame>>3)&1?'#ffd640':'#ffffff',4,1);
      light(W/2,80,170,YL,0.22);textS('LE NOYAU EST DETRUIT. LA GALAXIE EST LIBRE.',W/2,108,'#48ecff',1,1);
      textS('SCORE FINAL '+pad(score,7),W/2,130,'#ffffff',2,1);textS('MEILLEUR SCORE '+pad(hi,7),W/2,150,'#ffd640',1,1);
      ds(S.ship,W/2+Math.sin(frame*0.03)*60,190+Math.sin(frame*0.05)*6);light(W/2+Math.sin(frame*0.03)*60-14,190,14,CY,0.8);
      if(overT>120&&(frame>>5)&1)textS('ENTREE : ECRAN TITRE',W/2,225,'#ffffff',1,1);}
  }
  if(flashA>0){g.fillStyle='rgba('+flashC+','+flashA+')';g.fillRect(0,0,W,H);}
  if(paused){g.fillStyle='rgba(0,0,10,0.55)';g.fillRect(0,0,W,H);text('PAUSE',W/2,110,'#ffffff',5,1);textS('P POUR REPRENDRE',W/2,146,'#9aa6d8',1,1);}
  if(muted)textS('MUET',W-22,15,'#9aa6d8');
}

// ---------------------------------------------------------------- boucle
let last=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;let n=0;
  while(acc>=16.6&&n<4){update();acc-=16.6667;n++;}
  if(n===4)acc=0;
  draw();present();musicTick();
}
window.AV={get s(){return{state:state,level:level,lt:lt,boss:boss?{hp:boss.hp,x:boss.x,dying:boss.dying}:null,score:score,lives:lives,alive:P.alive,enemies:enemies.length,eb:eb.length,clearT:clearT};},
  step:function(n){for(let i=0;i<n;i++)update();draw();present();},P:P,bossHit:function(d){if(boss)bossHit(boss,d);}};
requestAnimationFrame(loop);
})();
</script>
